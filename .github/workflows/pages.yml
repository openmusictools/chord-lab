name: Build offline download and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: python3 scripts/build-offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: chord-lab-offline
          path: downloads/chord-lab.htm
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html favicon.* icon-*.png apple-touch-icon.png site.webmanifest .nojekyll _site/
          cp -r assets css js downloads _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
